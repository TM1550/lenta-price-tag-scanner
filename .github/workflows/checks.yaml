name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit==3.8.0
      - run: pre-commit run --all-files
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy Pillow omegaconf hydra-core rapidfuzz opencv-python-headless click fire
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests
      - run: price-scanner infer --show-config
