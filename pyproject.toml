[tool.poetry]
name = "lenta-price-tag-scanner"
version = "0.1.0"
description = "Price tag detection using YOLOv8"
authors = ["Мэргэн Цыренов"]
readme = "README.md"
packages = [{include = "lenta_price_tag_scanner"}, {include = "configs"}]
include = [{path = "configs/**/*.yaml", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
ultralytics = "^8.2.0"
lap = "==0.5.12"
torch = {version = "2.11.0+cu128", source = "pytorch-cu128"}
torchvision = {version = "0.26.0+cu128", source = "pytorch-cu128"}
timm = "^1.0.0"
Pillow = ">=10,<13"
hydra-core = "^1.3.0"
opencv-python = ">=4.9,<6"
fire = "^0.6.0"
omegaconf = "^2.3.0"
click = ">=8,<9"
numpy = ">=1.26,<3"

[tool.poetry.scripts]
price-scanner = "lenta_price_tag_scanner.commands:main"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.0"
black = "^24.4.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.poetry.group.ocr]
optional = true

[tool.poetry.group.ocr.dependencies]
easyocr = "^1.7.2"
zxing-cpp = "^3.0.0"
rapidfuzz = ">=3,<4"

[tool.poetry.group.vlm]
optional = true

[tool.poetry.group.vlm.dependencies]
transformers = ">=4.57,<5"
accelerate = ">=1,<2"
sentencepiece = ">=0.2,<0.3"
einops = ">=0.8,<0.9"
rapidfuzz = ">=3,<4"

[tool.poetry.group.paddle]
optional = true

[tool.poetry.group.paddle.dependencies]
paddleocr = "==3.3.2"
paddlepaddle = "==3.2.2"
paddlex = "==3.3.13"

[tool.poetry.group.train]
optional = true
[tool.poetry.group.train.dependencies]
lightning = "^2.6.0"
matplotlib = "^3.10.0"
mlflow = "^3.17.0"
gitpython = "^3.1.0"

[tool.poetry.group.data]
optional = true
[tool.poetry.group.data.dependencies]
dvc = "^3.49.0"
gdown = ">=5,<6"

[tool.poetry.group.export]
optional = true
[tool.poetry.group.export.dependencies]
onnx = ">=1.16,<2"
onnxruntime = ">=1.20,<2"

[tool.poetry.group.serve]
optional = true
[tool.poetry.group.serve.dependencies]
mlflow = "^3.17.0"
pandas = ">=2.2,<3"
